<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Demo Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>☁️ Azure Demo Dashboard</h1>

    <div class="card">
        <h2>Status (API)</h2>
        <p id="status">Loading...</p>
        <button onclick="getStatus()">Refresh Status</button>
    </div>

    <div class="card">
        <h2>Visits</h2>
        <p id="visits">0</p>
        <button onclick="addVisit()">Simulate Visit</button>
    </div>

    <div class="card">
        <h2>Environment</h2>
        <p>Demo</p>
    </div>

    <div class="card">
        <h2>Estimated Cost</h2>
        <p>$0.01</p>
    </div>

    <div class="card">
        <h2>Last Updated</h2>
        <p id="time"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
